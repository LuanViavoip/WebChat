worker_processes 1;
error_log /tmp/webchat-nginx-error.log;
pid /tmp/webchat-nginx.pid;

events {
  worker_connections 128;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /tmp/webchat-nginx-access.log;

  server {
    listen 127.0.0.1:8090;
    server_name localhost;
    root /workspace/infra/demo;
    index index.html;

    location / {
      try_files $uri /index.html;
    }
  }
}
